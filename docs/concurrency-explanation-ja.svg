<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 34px "Yu Gothic", "Meiryo", sans-serif; fill: #172033; }
      .subtitle { font: 500 18px "Yu Gothic", "Meiryo", sans-serif; fill: #526070; }
      .box { fill: #ffffff; stroke: #cbd7e6; stroke-width: 2; rx: 18; }
      .box-blue { fill: #eaf3ff; stroke: #6aa5e8; }
      .box-green { fill: #ebf8f0; stroke: #64b77b; }
      .box-orange { fill: #fff4e5; stroke: #f0a23a; }
      .box-purple { fill: #f2ecff; stroke: #9b7ae6; }
      .label { font: 700 22px "Yu Gothic", "Meiryo", sans-serif; fill: #172033; }
      .body { font: 500 17px "Yu Gothic", "Meiryo", sans-serif; fill: #334155; }
      .small { font: 500 15px "Yu Gothic", "Meiryo", sans-serif; fill: #607086; }
      .arrow { stroke: #64748b; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .thin { stroke-width: 2.5; }
      .badge { fill: #172033; }
      .badgeText { font: 700 15px "Yu Gothic", "Meiryo", sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <text x="64" y="70" class="title">同時利用時のデータ保存の仕組み</text>
  <text x="64" y="104" class="subtitle">40人程度の授業内利用を想定し、アクセス集中によるサーバー負荷とデータ欠損リスクを下げる設計</text>

  <!-- Students -->
  <rect x="64" y="165" width="220" height="360" class="box box-blue"/>
  <text x="94" y="210" class="label">学生端末</text>
  <text x="94" y="245" class="body">教材編集・マーカー・</text>
  <text x="94" y="272" class="body">キーワード化など</text>

  <circle cx="128" cy="335" r="28" fill="#ffffff" stroke="#6aa5e8" stroke-width="2"/>
  <text x="118" y="344" class="label">1</text>
  <circle cx="194" cy="335" r="28" fill="#ffffff" stroke="#6aa5e8" stroke-width="2"/>
  <text x="184" y="344" class="label">2</text>
  <circle cx="128" cy="410" r="28" fill="#ffffff" stroke="#6aa5e8" stroke-width="2"/>
  <text x="118" y="419" class="label">3</text>
  <circle cx="194" cy="410" r="28" fill="#ffffff" stroke="#6aa5e8" stroke-width="2"/>
  <text x="178" y="419" class="label">40</text>
  <text x="94" y="480" class="small">同じ Wi-Fi から同時アクセス</text>

  <!-- Browser queue -->
  <rect x="370" y="165" width="240" height="360" class="box box-green"/>
  <text x="405" y="210" class="label">ブラウザ側キュー</text>
  <text x="405" y="246" class="body">操作ログを一時保存</text>
  <text x="405" y="278" class="body">すぐ送らずまとめる</text>

  <rect x="415" y="325" width="150" height="34" rx="8" fill="#ffffff" stroke="#64b77b"/>
  <rect x="415" y="369" width="150" height="34" rx="8" fill="#ffffff" stroke="#64b77b"/>
  <rect x="415" y="413" width="150" height="34" rx="8" fill="#ffffff" stroke="#64b77b"/>
  <text x="433" y="348" class="small">操作イベント</text>
  <text x="433" y="392" class="small">操作イベント</text>
  <text x="433" y="436" class="small">操作イベント</text>
  <text x="405" y="485" class="small">20件または2.5秒ごとに送信</text>

  <!-- Server batch -->
  <rect x="696" y="165" width="240" height="360" class="box box-orange"/>
  <text x="736" y="210" class="label">サーバー側</text>
  <text x="736" y="246" class="body">一括受信</text>
  <text x="736" y="278" class="body">重複を無視</text>
  <text x="736" y="310" class="body">トランザクション処理</text>

  <rect x="742" y="360" width="148" height="56" rx="12" fill="#ffffff" stroke="#f0a23a"/>
  <text x="762" y="394" class="body">batch API</text>
  <text x="730" y="485" class="small">小さい書き込みをまとめて処理</text>

  <!-- SQLite -->
  <rect x="1010" y="165" width="220" height="360" class="box box-purple"/>
  <text x="1050" y="210" class="label">SQLite DB</text>
  <text x="1050" y="246" class="body">WAL モード</text>
  <text x="1050" y="278" class="body">読み書き競合を軽減</text>

  <ellipse cx="1120" cy="370" rx="74" ry="26" fill="#ffffff" stroke="#9b7ae6" stroke-width="2"/>
  <rect x="1046" y="370" width="148" height="92" fill="#ffffff" stroke="#9b7ae6" stroke-width="2"/>
  <ellipse cx="1120" cy="462" rx="74" ry="26" fill="#ffffff" stroke="#9b7ae6" stroke-width="2"/>
  <text x="1072" y="421" class="body">gakuzai.sqlite</text>
  <text x="1048" y="485" class="small">操作ログを永続保存</text>

  <!-- Arrows -->
  <path d="M 284 345 L 368 345" class="arrow"/>
  <path d="M 610 345 L 694 345" class="arrow"/>
  <path d="M 936 345 L 1008 345" class="arrow"/>

  <!-- Bottom explanation -->
  <rect x="64" y="585" width="1166" height="78" rx="18" fill="#ffffff" stroke="#cbd7e6" stroke-width="2"/>
  <text x="94" y="620" class="body">要点：</text>
  <text x="150" y="620" class="body">各操作を即時送信せず、ブラウザ側で一時保存してまとめて送信する。</text>
  <text x="150" y="650" class="body">サーバー側では一括処理と WAL モードにより、同時利用時の負荷とデータ欠損リスクを抑える。</text>

  <!-- Badges -->
  <rect x="392" y="137" width="196" height="34" rx="17" class="badge"/>
  <text x="415" y="160" class="badgeText">負荷を平準化する部分</text>
  <rect x="705" y="137" width="222" height="34" rx="17" class="badge"/>
  <text x="729" y="160" class="badgeText">データ保存を安定化する部分</text>
</svg>
