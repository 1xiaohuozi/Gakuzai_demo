<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAKUZAI Login</title>
  <link rel="stylesheet" href="./assets/styles/main.css" />
  <link rel="stylesheet" href="./assets/styles/auth.css" />
</head>

<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-hero" aria-labelledby="authTitle">
      <div class="auth-hero__brand">電子教材加工プラットフォーム</div>
      <h1 id="authTitle" class="auth-hero__title">GAKUZAI</h1>
      <p class="auth-hero__copy">
        Function→Area/Range の操作方式で、教材編集をすばやく、ユーザーごとに保存します。
      </p>
    </section>

    <section class="auth-card" aria-label="ログインまたは登録">
      <div class="auth-card__head">
        <p class="auth-card__eyebrow">Secure Workspace</p>
        <h2 id="authCardTitle" class="auth-card__title">ログイン</h2>
      </div>

      <div class="auth-tabs" role="tablist" aria-label="認証モード">
        <button id="loginTab" class="auth-tab is-active" type="button" role="tab" aria-selected="true"
          data-auth-mode="login">ログイン</button>
        <button id="registerTab" class="auth-tab" type="button" role="tab" aria-selected="false"
          data-auth-mode="register">登録</button>
      </div>

      <form id="authPageForm" class="auth-form" novalidate>
        <label id="authNameField" class="auth-field" hidden>
          <span>名前</span>
          <input id="authNameInput" class="sa-input" type="text" autocomplete="name">
        </label>
        <label class="auth-field">
          <span>メール</span>
          <input id="authEmailInput" class="sa-input" type="email" autocomplete="email" required>
        </label>
        <label class="auth-field">
          <span>パスワード</span>
          <input id="authPasswordInput" class="sa-input" type="password" autocomplete="current-password" required>
        </label>
        <button id="authSubmitBtn" class="sa-btn se-btn--primary auth-submit" type="submit">ログイン</button>
      </form>

      <p id="authMessage" class="auth-message" role="status"></p>
      <p id="authModeHint" class="auth-switch">アカウントがない場合は「登録」タブへ。</p>
    </section>
  </main>

  <script src="./assets/scripts/auth-page.js"></script>
</body>

</html>
